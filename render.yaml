databases:
  - name: ocha-mysql
    databaseName: ocha
    user: ochauser
    plan: free
    region: singapore
    postgresMajorVersion: 14

services:
  - type: web
    name: ocha
    env: php
    region: singapore
    plan: free
    # buildCommand: "./bin/render-build.sh"
    # startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocha-mysql
          property: connectionString
      # - key: RAILS_MASTER_KEY
      #   sync: false